<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruoholahden Lounas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Lounassiili<span> //</span></h1>
    <p class="subtitle">Siili Solutions</p>
    <div class="location-tabs">
      <button class="loc-tab active" data-loc="ruoholahti">Ruoholahti</button>
      <button class="loc-tab" data-loc="keskusta">Keskusta</button>
      <button class="loc-tab" data-loc="kangasala">Kangasala</button>
      <button class="loc-tab" data-loc="tampere">Tampere</button>
    </div>
    <p class="last-updated" id="lastUpdated"></p>
  </header>

  <main>
    <div class="restaurants" id="restaurants">
      <p class="loading">Ladataan lounaslistoja...</p>
    </div>
  </main>

  <footer>
    <p>Päivitetään automaattisesti arkisin klo 06:00</p>
    <button id="refreshBtn" class="refresh-btn">Päivitä nyt</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
